# CD: every merge to main runs the full CI, then builds each image ONCE and publishes it tagged
# with the commit SHA. Later stages deploy that exact tag to dev automatically and promote the
# same tag to test, so test always runs a build that was verified in dev (RT-106 AC 2).
#
# The deploy stages are added when the dev and test environments exist; they depend on the
# hosting and vault decision in ADR-002 (RT-105). Until then this workflow ends at "publish".
#
# Registry login uses the workflow's short-lived GITHUB_TOKEN: no stored credentials, no
# pipeline secret variables (RT-106 AC 4).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  publish:
    name: Publish images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: src/Services/ReportingTool.Api/Dockerfile
          - name: web
            context: src/Web
            dockerfile: src/Web/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
