# Local environment: SQL Server + API + web, the same images the pipeline builds.
#   1. scripts/init-local-secrets.ps1 (or .sh)   once per machine
#   2. docker compose up --build                 → http://localhost:8080
#      Set RT_SOURCE_REVISION to `git rev-parse HEAD` first to show the commit (see api.build).
# See "Architecture/Developer Setup & Pipelines" in Paca for the full guide.
# Several agents share one Docker host, so each workspace sets COMPOSE_PROJECT_NAME and the
# RT_*_PORT variables to its own values; the defaults below are for a single developer.
name: reporting-tool

services:
  sqlserver:
    # Pinned to a cumulative update so every clone runs the same engine. Change it deliberately,
    # together with ApiFactory.cs and the licence inventory (ADR-002 §8).
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    # The image reads the SA password only from MSSQL_SA_PASSWORD, so it is exported from the
    # Compose secret file inside the container. It never appears in this file or in a .env file.
    entrypoint:
      - /bin/bash
      - -c
      - export MSSQL_SA_PASSWORD="$$(cat /run/secrets/sql_sa_password)" && exec /opt/mssql/bin/launch_sqlservr.sh /opt/mssql/bin/sqlservr
    secrets:
      - sql_sa_password
    ports:
      - "${RT_SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$(cat /run/secrets/sql_sa_password)\" -C -b -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/Services/ReportingTool.Api/Dockerfile
      # The commit shown by /api/system/info. Compose cannot run git and the build context
      # excludes .git/, so set RT_SOURCE_REVISION to `git rev-parse HEAD` before building;
      # without it the version ends in "+local".
      args:
        SOURCE_REVISION: ${RT_SOURCE_REVISION:-local}
    image: ${COMPOSE_PROJECT_NAME:-reporting-tool}-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    # Mounted at /run/secrets/Database__ConnectionString: one file per key, the layout every
    # platform secret uses (ADR-002 §5.2).
    secrets:
      - source: api_database_connection_string
        target: Database__ConnectionString
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${RT_API_PORT:-5080}:8080"

  web:
    build:
      context: src/Web
    image: ${COMPOSE_PROJECT_NAME:-reporting-tool}-web:local
    environment:
      API_UPSTREAM: http://api:8080
    depends_on:
      - api
    ports:
      - "${RT_WEB_PORT:-8080}:8080"

secrets:
  sql_sa_password:
    file: ./.secrets/sql_sa_password
  api_database_connection_string:
    file: ./.secrets/Database__ConnectionString

volumes:
  sqlserver-data:
